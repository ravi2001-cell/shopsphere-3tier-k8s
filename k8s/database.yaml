apiVersion: v1
kind: Secret
metadata:
  name: shopsphere-secrets
  namespace: shopsphere
type: Opaque
stringData:
  DB_PASSWORD: shopsphere123
  JWT_SECRET: change-this-demo-secret-key-change-this-demo-secret-key
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shopsphere
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: shopsphere
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - {name: POSTGRES_DB, value: shopsphere}
        - {name: POSTGRES_USER, value: shopsphere}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: shopsphere-secrets, key: DB_PASSWORD}}
        ports: [{containerPort: 5432}]
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
        readinessProbe: {exec: {command: ["sh","-c","pg_isready -U shopsphere"]}, initialDelaySeconds: 5, periodSeconds: 5}
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: ["ReadWriteOnce"]
      resources: {requests: {storage: 5Gi}}
