apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: shopsphere}
spec:
  replicas: 2
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
      - name: backend
        image: YOUR_DOCKERHUB_USER/shopsphere-backend:latest
        ports: [{containerPort: 8080}]
        env:
        - {name: DB_URL, value: "jdbc:postgresql://postgres:5432/shopsphere"}
        - {name: DB_USER, value: shopsphere}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: shopsphere-secrets, key: DB_PASSWORD}}
        - name: JWT_SECRET
          valueFrom: {secretKeyRef: {name: shopsphere-secrets, key: JWT_SECRET}}
        resources: {requests: {cpu: 100m, memory: 192Mi}, limits: {cpu: 500m, memory: 512Mi}}
        readinessProbe: {httpGet: {path: /api/health, port: 8080}, initialDelaySeconds: 15, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /api/health, port: 8080}, initialDelaySeconds: 30, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: shopsphere}
spec:
  selector: {app: backend}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: backend, namespace: shopsphere}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: backend}
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: 70}
